[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/download-file"
  function = "download"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
